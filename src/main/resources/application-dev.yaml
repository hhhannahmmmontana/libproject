spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:testdb
    username: sa
    password: password

  jpa:
    hibernate:
      format-sql: true
      ddl-auto: validate
    show-sql: true

services:
  books:
    default-page-size: 32

data-population:
  enabled: true

logging:
  level:
    com.volodya.libproject: TRACE
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: DEBUG
    org.springframework: INFO