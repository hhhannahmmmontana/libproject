spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:testdb
    username: sa
    password: password

  jpa:
    hibernate.format-sql: true
    show-sql: true

data-population:
  enabled: true
  strategy: empty-only
  data-amount:
    books: 300
    readers: 300
    book-loans: 300

management:
  endpoints:
    web.exposure.include: "*"
  endpoint:
    health.show-details: always
    heapdump.enabled: true