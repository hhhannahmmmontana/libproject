spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

management:
  endpoints:
    web.exposure.include: "health,info,metrics"
  metrics.enable:
    all: false
    jvm.memory.used: true
    http.server.requests: true