spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/postgres
    username: postgres
    password: postgres

data-population:
  enabled: true
  strategy: append-if-less
  data-amount:
    books: 1500
    readers: 1500
    book-loans: 1500

management:
  endpoints:
    web.exposure.include: "health,metrics,info,prometheus"
  endpoint.health.show-details: always
  info:
    git.mode: full
    env.enabled: true
    build.enabled: true
